spring.application.name=demo
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show.mysql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl.auto=update
spring.jpa.properties.hibernate.dialect.=org.hibernate.dialect.MySQLDialect

# Show log.debug(...) lines from our own code (Spring itself stays at INFO)
logging.level.expenseTracker.demo=DEBUG

# Run data.sql (category seed) on every startup, after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Google Sign-In: the *Web application* OAuth client ID from Google Cloud Console
google.client-id=${GOOGLE_CLIENT_ID:562194251969-tku2omt4j9692bgjmec8c7oho8mtdh53.apps.googleusercontent.com}

# JWT: base64 secret of at least 32 bytes. The default is for local dev only; set JWT_SECRET anywhere real.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLTEyMzQ1Njc4}
jwt.access-ttl-seconds=900
jwt.refresh-ttl-days=30

